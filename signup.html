<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripSplit — Create Account</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="signup">
    <main class="auth-shell">
        <a class="auth-brand" href="/">TripSplit</a>
        <section class="auth-card">
            <div class="auth-kicker">START SPLITTING</div>
            <h1>Create your account</h1>
            <p class="auth-subtitle">Keep every trip, expense, and settlement together.</p>
            <form id="signup-form" class="auth-form">
                <div class="form-group"><label for="signup-name">Full name</label><input id="signup-name" name="name" autocomplete="name" required placeholder="Alex Morgan"></div>
                <div class="form-group"><label for="signup-email">Email address</label><input id="signup-email" name="email" type="email" autocomplete="email" required placeholder="alex@example.com"></div>
                <div class="form-group"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div>
                <p id="auth-error" class="auth-error" role="alert" hidden></p>
                <button class="primary-btn auth-submit" type="submit">Create account →</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>
    <script src="/app.js"></script>
</body>
</html>
