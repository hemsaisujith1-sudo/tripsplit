<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripSplit — Log In</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="login">
    <main class="auth-shell">
        <a class="auth-brand" href="/">TripSplit</a>
        <section class="auth-card">
            <div class="auth-kicker">WELCOME BACK</div>
            <h1>Log in to TripSplit</h1>
            <p class="auth-subtitle">Pick up where your group left off.</p>
            <form id="login-form" class="auth-form">
                <div class="form-group"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" required placeholder="alex@example.com"></div>
                <div class="form-group"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"></div>
                <p id="auth-error" class="auth-error" role="alert" hidden></p>
                <button class="primary-btn auth-submit" type="submit">Log in →</button>
            </form>
            <p class="auth-switch">New to TripSplit? <a href="signup.html">Create an account</a></p>
        </section>
    </main>
    <script src="/app.js"></script>
</body>
</html>
