<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripSplit — New Trip</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="newTrip" data-nav-active="home">
    <header id="global-header"></header>
    <main id="page-wrap" class="page-wrap">
        <div id="breadcrumb-slot"></div>
        <div class="container">
            <div class="card">
                <h1 id="newtrip-page-title" class="page-title">Create New Trip</h1>
                <p class="page-subtitle">Enter your trip details.</p>

                <div id="newTripError" class="message error-message"></div>

                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input id="destination" type="text" placeholder="e.g. Goa">
                </div>

                <div class="form-group">
                    <label for="currencySelect">Currency</label>
                    <select id="currencySelect"></select>
                </div>

                <div class="form-group">
                    <label for="startDate">Trip Start Date</label>
                    <input id="startDate" class="date-input" type="date" onclick="openDatePicker('startDate')">
                </div>

                <div class="form-group">
                    <label for="endDate">Trip End Date</label>
                    <input id="endDate" class="date-input" type="date" onclick="openDatePicker('endDate')">
                </div>

                <div class="form-group">
                    <label>Number of Members</label>
                    <div class="member-stepper">
                        <button class="stepper-btn" type="button" onclick="changeMembers(-1)">−</button>
                        <div id="memberCount" class="member-number">4</div>
                        <button class="stepper-btn" type="button" onclick="changeMembers(1)">+</button>
                    </div>
                </div>

                <button class="primary-btn" style="width:100%;" type="button" onclick="createTrip()">Continue →</button>
            </div>
        </div>
    </main>
    <script src="/app.js"></script>
</body>
</html>
