<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripSplit — Add Expense</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hemsaisujith1-sudo/tripsplit@2f83959/styles.css">
</head>
<body data-page="expense" data-nav-active="ongoing">
    <header id="global-header"></header>
    <main id="page-wrap" class="page-wrap">
        <div id="breadcrumb-slot"></div>
        <div class="container">
            <div class="card">
                <h1 class="page-title">Add Expense</h1>
                <p class="page-subtitle">Record money spent by this member.</p>

                <div id="expenseSuccess" class="message success-message"></div>
                <div id="expenseError" class="message error-message"></div>

                <div id="selectedMemberBox" class="selected-member"></div>

                <div class="form-group">
                    <label for="expenseAmount">How much did they spend?</label>
                    <input id="expenseAmount" type="number" min="0" step="0.01" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="expenseDescription">What did they spend it on?</label>
                    <input id="expenseDescription" type="text" placeholder="e.g. Hotel, Food, Transport">
                </div>

                <div id="splitSectionContainer"></div>

                <button id="expenseSubmitBtn" class="primary-btn" style="width:100%;" type="button" onclick="addExpense()">
                    ➕ Add Expense
                </button>

                <div class="expense-list">
                    <h3 style="margin-bottom:15px;">Expenses Added</h3>
                    <div id="memberExpenseList"></div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/gh/hemsaisujith1-sudo/tripsplit@2f83959/app.js"></script>
</body>
</html>
